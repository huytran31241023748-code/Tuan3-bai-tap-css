<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 7 – Bố cục trang</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: min(510px, calc(100% - 32px));
      margin: 24px auto;
      font-family: Arial, sans-serif;
      font-size: clamp(20px, 5vw, 32px);
    }

    .wrapper-label {
      margin: 0 0 8px 12px;
    }

    #wrapper {
      display: grid;
      grid-template-columns: max(60px, 19%) minmax(0, 1fr);
      grid-template-rows: 82px 376px 56px;
      grid-template-areas:
        "header header"
        "nav    main"
        "footer footer";
      gap: 10px;
      padding: 12px;
      border: 3px solid black;
    }

    #wrapper > * {
      padding: 8px 10px;
      border: 3px solid black;
    }

    header { grid-area: header; }
    #wrapper > nav { grid-area: nav; padding-inline: 6px; }
    main   { grid-area: main; }
    footer { grid-area: footer; }
  </style>
</head>
<body>
  <p class="wrapper-label">wrapper</p>
  <div id="wrapper">
    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <footer>footer</footer>
  </div>
</body>
</html>
